name: Build static page caches

on:
  workflow_run:
    workflows:
      - Refresh value-investing stock cache
      - Refresh stock fundamentals
    types: [completed]
    branches: [master]
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "scripts/build_stock_detail_cache.js"
      - "scripts/build_research_scores.js"
      - "scripts/build_sector_monthly.js"
      - "scripts/build_cache_manifest.js"
      - "scripts/validate_stock_data.js"
      - "research-score.js"
      - ".github/workflows/build-static-cache.yml"

permissions:
  contents: write

concurrency:
  group: static-cache-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, validate and publish from the latest source revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            export CACHE_BUILD_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            node scripts/build_stock_detail_cache.js
            node scripts/build_sector_monthly.js
            node scripts/build_research_scores.js
            node scripts/build_cache_manifest.js
            node scripts/validate_stock_data.js

            if [ -z "$(git status --porcelain -- data/sector-monthly.json data/research-scores.json data/cache/stocks data/cache/stock-details.json data/cache/manifest.json data/monitoring/latest.json)" ]; then
              echo "Static page caches are already current."
              exit 0
            fi

            git add data/sector-monthly.json data/research-scores.json data/cache/stocks data/cache/stock-details.json data/cache/manifest.json data/monitoring/latest.json
            git commit -m "Build static page caches"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Master changed during cache publication (attempt $attempt); rebuilding from latest master."
          done
          echo "Unable to publish static page caches after 3 attempts." >&2
          exit 1
