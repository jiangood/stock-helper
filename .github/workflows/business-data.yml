name: Fetch commodity business data

on:
  schedule:
    # Four refresh windows on weekdays (UTC); covers China daytime and evening.
    - cron: "15 2,6,8,10 * * 1-5"
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "scripts/fetch_business_data.py"
      - "business-data.json"
      - ".github/workflows/business-data.yml"

permissions:
  contents: write

concurrency:
  group: business-data-refresh
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data client
        run: python -m pip install --upgrade pip akshare pandas
      - name: Fetch commodity data
        run: python scripts/fetch_business_data.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- business-data.json; then
            echo "No business data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business-data.json
          git commit -m "Refresh automatic commodity business data"
          git push
