name: One-off Customs statistics portal probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/probe_customs_stats_portal.py"
      - ".github/workflows/customs-stats-portal-probe.yml"

permissions:
  contents: read

concurrency:
  group: customs-stats-portal-probe
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect public portal frontend only
        run: python scripts/probe_customs_stats_portal.py
