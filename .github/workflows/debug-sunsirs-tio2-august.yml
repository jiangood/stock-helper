name: Debug Sunsirs titanium dioxide August chart image

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/debug-sunsirs-tio2-august.yml"
      - "scripts/test_sunsirs_month_start_ocr.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-august-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install chart OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --disable-pip-version-check requests numpy opencv-python-headless
      - name: Fetch August chart with full-month range and compare short range
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from sunsirs_chart import fetch_chart_image

          urls = {
              "full-month": "https://www.100ppi.com/graph/report.php?btime=2026-08-01&etime=2026-08-31&f=xht_agent_price&ppid=645",
              "collector-short-range": "https://www.100ppi.com/graph/report.php?btime=2026-8-1&etime=2026-8-2&f=xht_agent_price&ppid=645",
          }
          for label, url in urls.items():
              result = fetch_chart_image(url, Path("artifacts/sunsirs-august") / f"{label}.png")
              print(f"{label}: HTTP {result['status_code']}, {result['content_type']}, {result['bytes']} bytes, sha256={result['sha256']}, url={result['url']}")
          PY
      - name: Diagnose blue target curve versus non-blue curves
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np

          out = Path('artifacts/sunsirs-august')
          for label in ('full-month', 'collector-short-range'):
              path = out / f'{label}.png'
              image = cv2.imread(str(path))
              if image is None:
                  raise RuntimeError(f'cannot read {path}')
              hsv = cv2.cvtColor(image, cv2.COLOR_BGR2HSV)
              plot = hsv[80:430, 60:760]
              # Keep the known blue hue family separate; report other saturated
              # colors independently rather than assuming their chart meaning.
              blue = cv2.inRange(plot, np.array([95, 70, 60], np.uint8), np.array([135, 255, 255], np.uint8))
              saturated = cv2.inRange(plot, np.array([0, 70, 60], np.uint8), np.array([179, 255, 255], np.uint8))
              non_blue = cv2.bitwise_and(saturated, cv2.bitwise_not(blue))
              count, labels, stats, centroids = cv2.connectedComponentsWithStats(blue, 8)
              components = sorted(
                  [(int(stats[i, cv2.CC_STAT_AREA]), int(stats[i, cv2.CC_STAT_WIDTH]),
                    int(stats[i, cv2.CC_STAT_HEIGHT]), round(float(centroids[i][0]) + 60, 1),
                    round(float(centroids[i][1]) + 80, 1))
                   for i in range(1, count) if stats[i, cv2.CC_STAT_AREA] >= 3],
                  reverse=True
              )
              print(f'{label}: blue_pixels={cv2.countNonZero(blue)}, non_blue_saturated_pixels={cv2.countNonZero(non_blue)}')
              print(f'{label}: blue_components(area,width,height,cx,cy)={components[:40]}')
              # Diagnostic overlays: blue pixels in blue, other saturated
              # pixels in red; gray background preserves grid/context.
              overlay = image.copy()
              region = overlay[80:430, 60:760]
              region[blue > 0] = (255, 0, 0)
              region[non_blue > 0] = (0, 0, 255)
              cv2.imwrite(str(out / f'{label}-color-diagnostic.png'), overlay)
              cv2.imwrite(str(out / f'{label}-blue-mask.png'), blue)
          PY
      - name: Compare Tesseract page segmentation modes on short-range axis
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, cv2
          image = cv2.imread('artifacts/sunsirs-august/collector-short-range.png')
          crop = image[75:435, 0:60]
          for scale in (4, 6, 8):
              enlarged = cv2.resize(crop, None, fx=scale, fy=scale, interpolation=cv2.INTER_CUBIC)
              path = Path(f'/tmp/axis-{scale}.png')
              cv2.imwrite(str(path), enlarged)
              for psm in (6, 7, 8, 11, 13):
                  result = subprocess.run(['tesseract', str(path), 'stdout', '--psm', str(psm), 'tsv'], capture_output=True, text=True)
                  rows = [line for line in result.stdout.splitlines()[1:] if line.strip()]
                  words = [line.split('\t')[-1] for line in rows if line.split('\t')[-1].strip()]
                  print(f'scale={scale} psm={psm}: {words}')
          PY
      - name: Run the production OCR estimator against both images
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from test_sunsirs_month_start_ocr import estimate_first_price, read_axis_ticks
          import cv2

          for label in ("full-month", "collector-short-range"):
              path = Path("artifacts/sunsirs-august") / f"{label}.png"
              image = cv2.imread(str(path))
              print(f"{label}: axis_ticks={read_axis_ticks(image)}")
              print(f"{label}: estimate={estimate_first_price(path, '2026-08')}")
          PY
      - name: Upload returned chart images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunsirs-tio2-august-chart-debug
          path: artifacts/sunsirs-august/*.png
          if-no-files-found: error
          retention-days: 7
