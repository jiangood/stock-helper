name: Debug Sunsirs titanium dioxide August chart image

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/debug-sunsirs-tio2-august.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-august-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install chart OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --disable-pip-version-check requests numpy opencv-python-headless
      - name: Fetch August chart with full-month range and compare short range
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from sunsirs_chart import fetch_chart_image

          urls = {
              "full-month": "https://www.100ppi.com/graph/report.php?btime=2026-08-01&etime=2026-08-31&f=xht_agent_price&ppid=645",
              "collector-short-range": "https://www.100ppi.com/graph/report.php?btime=2026-8-1&etime=2026-8-2&f=xht_agent_price&ppid=645",
          }
          for label, url in urls.items():
              result = fetch_chart_image(url, Path("artifacts/sunsirs-august") / f"{label}.png")
              print(f"{label}: HTTP {result['status_code']}, {result['content_type']}, {result['bytes']} bytes, sha256={result['sha256']}, url={result['url']}")
          PY
      - name: Run the production OCR estimator against both images
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from test_sunsirs_month_start_ocr import estimate_first_price, read_axis_ticks
          import cv2

          for label in ("full-month", "collector-short-range"):
              path = Path("artifacts/sunsirs-august") / f"{label}.png"
              image = cv2.imread(str(path))
              print(f"{label}: axis_ticks={read_axis_ticks(image)}")
              print(f"{label}: estimate={estimate_first_price(path, '2026-08')}")
          PY
      - name: Upload returned chart images
        uses: actions/upload-artifact@v4
        with:
          name: sunsirs-tio2-august-chart-debug
          path: artifacts/sunsirs-august/*.png
          if-no-files-found: error
          retention-days: 7
