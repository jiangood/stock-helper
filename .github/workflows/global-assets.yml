name: Refresh global asset quotes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "scripts/fetch_global_assets.py"
      - "global-assets-data.json"
      - ".github/workflows/global-assets.yml"

permissions:
  contents: write

concurrency:
  group: global-assets-refresh
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch global asset quotes
        run: python scripts/fetch_global_assets.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- global-assets-data.json; then
            echo "No global asset data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-assets-data.json
          git commit -m "Refresh global asset quotes"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase -X theirs "origin/$GITHUB_REF_NAME"
          git push
