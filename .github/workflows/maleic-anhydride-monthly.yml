name: Refresh maleic anhydride monthly chart history

on:
  schedule:
    - cron: "45 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maleic-anhydride-monthly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip requests opencv-python-headless numpy
      - name: Backfill missing month-start chart observations
        run: python scripts/collect_maleic_anhydride_monthly.py
      - name: Validate collected history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("data/maleic-anhydride-monthly.json").read_text(encoding="utf-8"))
          assert p["id"] == "maleic-anhydride"
          assert p["unit"] == "元/吨"
          assert isinstance(p["points"], list)
          months = [x["month"] for x in p["points"]]
          assert months == sorted(set(months))
          for point in p["points"]:
              assert point["status"] in ("estimated", "no_data")
              assert point["estimated"] is True
              if point["status"] == "estimated":
                  assert isinstance(point["value"], (int, float)) and point["value"] > 0
              else:
                  assert point["value"] is None
          print("validated", len(p["points"]), "monthly observations")
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build commodity comparison database
        run: node scripts/build_product_comparison.js
      - name: Commit refreshed history
        run: |
          if git diff --quiet -- data/maleic-anhydride-monthly.json data/commodity-db/; then
            echo "No maleic anhydride data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/maleic-anhydride-monthly.json data/commodity-db/
          git commit -m "Refresh maleic anhydride monthly chart history"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase -X theirs "origin/$GITHUB_REF_NAME"
          git push
