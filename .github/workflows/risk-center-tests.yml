name: Holdings risk center tests

on:
  push:
    branches:
      - master
      - feature/holdings-risk-center
      - feature/holdings-json-source
    paths:
      - 'risk-center.js'
      - 'holdings-data.js'
      - 'data/holdings.json'
      - 'business.js'
      - 'stock.js'
      - 'stock.html'
      - 'sw.js'
      - 'index.html'
      - 'tests/risk-center.test.js'
      - 'tests/holdings-data.test.js'
      - '.github/workflows/risk-center-tests.yml'
  pull_request:
    paths:
      - 'risk-center.js'
      - 'holdings-data.js'
      - 'data/holdings.json'
      - 'business.js'
      - 'stock.js'
      - 'stock.html'
      - 'sw.js'
      - 'index.html'
      - 'tests/risk-center.test.js'
      - 'tests/holdings-data.test.js'
      - '.github/workflows/risk-center-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check risk-center.js
          node --check holdings-data.js
          node --check business.js
      - name: Risk and holdings JSON tests
        run: node --test tests/risk-center.test.js tests/holdings-data.test.js
