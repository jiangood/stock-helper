name: Holdings risk center tests

on:
  push:
    branches:
      - master
      - feature/holdings-risk-center
    paths:
      - 'risk-center.js'
      - 'tests/risk-center.test.js'
      - '.github/workflows/risk-center-tests.yml'
  pull_request:
    paths:
      - 'risk-center.js'
      - 'tests/risk-center.test.js'
      - '.github/workflows/risk-center-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check risk-center.js
      - name: Risk calculation tests
        run: node tests/risk-center.test.js
