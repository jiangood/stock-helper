name: Refresh value-investing stock cache

on:
  schedule:
    # After the China A-share session; UTC 07:25 = Beijing 15:25.
    - cron: "25 7 * * 1-5"
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "scripts/fetch_stock_snapshot.js"
      - "scripts/validate_stock_data.js"
      - "research-score.js"
      - "quotes.js"
      - "data/stocks.json"
      - ".github/workflows/stock-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: stock-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate scripts
        run: |
          node --check quotes.js
          node --check scripts/fetch_stock_snapshot.js
          node --check scripts/build_research_scores.js
          node --check scripts/build_cache_manifest.js
          node --check research-score.js
          node --check static-quotes.js
      - name: Fetch source stock snapshots
        run: node scripts/fetch_stock_snapshot.js
        env:
          SKIP_DERIVED: "1"
      - name: Validate published data integrity
        run: node scripts/validate_stock_data.js --skip-cache-manifest --skip-detail-caches
      - name: Commit changed snapshots only
        run: |
          if [ -z "$(git status --porcelain -- data/stock-quotes.json data/index-cache.json data/stock-cache)" ]; then
            echo "No stock snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock-quotes.json data/index-cache.json data/stock-cache
          git commit -m "Refresh value-investing stock cache"
          for attempt in 1 2 3; do
            git fetch origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
            git rebase -X theirs "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push raced with another commit (attempt $attempt); retrying."
          done
          echo "Unable to publish stock cache after 3 attempts." >&2
          exit 1
