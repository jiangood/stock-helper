name: One-off Sunsirs maleic HTML probe

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "scripts/probe_sunsirs_maleic.py"
      - ".github/workflows/sunsirs-maleic-probe.yml"

permissions:
  contents: read

concurrency:
  group: sunsirs-maleic-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe public pages at low request rate
        run: python scripts/probe_sunsirs_maleic.py
