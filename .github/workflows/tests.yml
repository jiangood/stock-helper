name: Node tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build derived page read models for validation
        run: |
          node scripts/build_sector_monthly.js
          node scripts/build_research_scores.js
          node scripts/build_stock_detail_cache.js
      - name: Check cache builder syntax
        run: node --check scripts/build_cache_manifest.js
      - name: Build static cache manifest and health snapshot
        run: node scripts/build_cache_manifest.js
      - name: Run indicator and syntax tests
        run: node --test tests/*.test.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run business data tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate committed stock data
        run: node scripts/validate_stock_data.js
