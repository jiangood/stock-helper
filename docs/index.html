<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票助手 Stock Helper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" id="appContent" style="display:none">
  <div class="header">
    <h1>📈 股票助手 Stock Helper</h1>
    <div class="time" id="currentTime"></div>
  </div>

  <div class="controls">
    <button class="btn-primary" onclick="refreshPrices()">🔄 刷新价格</button>
    <button class="btn-secondary" onclick="toggleSort()">⇅ 切换排序</button>
    <div class="info">
      <span id="sortInfo">📊 排序: 盈亏</span>
      <span id="updateInfo">⏱ 上次更新: --</span>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>股票名称</th>
          <th class="text-right">当前价</th>
          <th class="text-right">推荐买入价</th>
          <th class="text-right">目标价</th>
          <th class="text-right">盈亏%</th>
          <th>分组</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody id="stockTableBody"></tbody>
    </table>
  </div>

  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" onclick="closeDetail()">✕ 关闭</button>
    <h2 id="detailName">股票详情</h2>
    <div class="detail-grid" id="detailGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="market-dashboard" id="marketDashboard" style="display:none">
  <div class="market-header">
    <div class="market-header-left">
      <h1>📊 A股行情</h1>
      <div class="market-subtitle">沪深指数实时行情</div>
    </div>
    <div class="market-header-right">
      <div class="market-time" id="marketTime">--</div>
      <div class="market-date" id="marketDate">--</div>
      <button class="btn-refresh-market" onclick="refreshIndices()">🔄 刷新</button>
    </div>
  </div>
  <div class="index-grid" id="indexGrid">
    <div class="loading">加载中...</div>
  </div>
  <div class="market-footer">
    <span>数据来源：东方财富</span>
    <span>｜</span>
    <span>更新于：<span id="marketUpdateTime">--</span></span>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
