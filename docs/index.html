<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票助手 Stock Helper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" id="appContent">
  <div class="header">
    <h1>📈 股票助手 Stock Helper</h1>
    <div class="time" id="currentTime"></div>
  </div>

  <div class="controls">
    <button class="btn-primary" onclick="refreshPrices()">🔄 刷新价格</button>
    <button class="btn-secondary" onclick="toggleSort()">⇅ 切换排序</button>
    <div class="info">
      <span id="sortInfo">📊 排序: 盈亏</span>
      <span id="updateInfo">⏱ 上次更新: --</span>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>股票名称</th>
          <th class="text-right">当前价</th>
          <th class="text-right">推荐买入价</th>
          <th class="text-right">目标价</th>
          <th class="text-right">盈亏%</th>
          <th>分组</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody id="stockTableBody"></tbody>
    </table>
  </div>

  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" onclick="closeDetail()">✕ 关闭</button>
    <h2 id="detailName">股票详情</h2>
    <div class="detail-grid" id="detailGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="password-overlay" id="passwordOverlay">
  <div class="password-box">
    <h2>🔒 股票助手</h2>
    <p>请输入密码</p>
    <input type="password" id="passwordInput" placeholder="输入密码" autofocus>
    <div class="error" id="passwordError">密码错误</div>
    <button onclick="checkPassword()">确认</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
