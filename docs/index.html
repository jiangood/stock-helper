<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票助手 Stock Helper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" id="appContent" style="display:none">
  <div class="header">
    <h1>📈 股票助手 Stock Helper</h1>
    <div class="time" id="currentTime"></div>
  </div>

  <div class="controls">
    <button class="btn-primary" onclick="refreshPrices()">🔄 刷新价格</button>
    <button class="btn-secondary" onclick="toggleSort()">⇅ 切换排序</button>
    <div class="info">
      <span id="sortInfo">📊 排序: 盈亏</span>
      <span id="updateInfo">⏱ 上次更新: --</span>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>股票名称</th>
          <th class="text-right">当前价</th>
          <th class="text-right">推荐买入价</th>
          <th class="text-right">目标价</th>
          <th class="text-right">盈亏%</th>
          <th>分组</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody id="stockTableBody"></tbody>
    </table>
  </div>

  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" onclick="closeDetail()">✕ 关闭</button>
    <h2 id="detailName">股票详情</h2>
    <div class="detail-grid" id="detailGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="quote-page" id="publicPage">
  <div class="quote-header">
    <h1>📊 投资格言</h1>
    <p class="quote-subtitle">在投资中修行，在时间里沉淀</p>
  </div>
  <div class="quote-grid" id="quoteGrid"></div>
  <div class="quote-footer">
    <p>—— 价值投资 · 长期主义 ——</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
