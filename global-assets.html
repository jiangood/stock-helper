<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球资产 · 股票助手</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/quasar@2.16.4/dist/quasar.prod.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root { --up: #dc2626; --down: #16a34a; }
  [data-bs-theme="dark"] { --up: #f23645; --down: #26a69a; }
  body { margin:0; font-size:13px; -webkit-font-smoothing:antialiased; }
  .q-toolbar { min-height:58px; }
  .q-toolbar__title { min-width:0; }
  .assets-page { max-width:1180px; margin:0 auto; padding-bottom:18px; }
  .panel-title { font-size:15px; font-weight:700; }
  .panel-subtitle,.mini-label { font-size:11px; color:var(--bs-secondary-color); }
  .insight-card { border:1px solid var(--bs-border-color); border-radius:12px; background:var(--bs-body-bg); padding:12px; }
  .insight-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; }
  .business-price { font-size:22px; font-weight:750; letter-spacing:-.5px; }
  .empty-state { padding:24px 12px; text-align:center; color:var(--bs-secondary-color); border:1px dashed var(--bs-border-color); border-radius:12px; }
  .text-up { color:var(--up)!important; }
  .text-down { color:var(--down)!important; }
  .flag { display:inline-block; font-size:9px; line-height:1.35; font-weight:600; padding:0 .2rem; border-radius:3px; border:1px solid var(--bs-border-color); color:var(--bs-secondary-color); background:var(--bs-tertiary-bg); }
  #assets-pane { min-height:calc(100vh - 130px); }
  #global-assets-cards .insight-card { min-width:0; overflow-wrap:anywhere; }
  #global-assets-cards a { color:var(--bs-primary); }
  .bottom-nav { border-top:1px solid var(--bs-border-color); }
  @media(max-width:575.98px) { .assets-page { padding-left:12px!important; padding-right:12px!important; } .insight-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; } .insight-card { padding:10px; } .business-price { font-size:19px; } }
</style>
</head>
<body class="bg-body-tertiary">
<div id="q-app">
  <q-layout view="hHh lpR fFf" class="bg-body-tertiary">
    <q-header bordered class="bg-body text-body">
      <q-toolbar>
        <q-btn flat round dense icon="arrow_back" aria-label="返回股票池" @click="goHome"></q-btn>
        <q-toolbar-title>
          <div class="text-weight-bold" style="font-size:15px">全球资产</div>
          <div class="text-caption text-grey-7" style="font-size:10px">市场环境与跨资产趋势</div>
        </q-toolbar-title>
        <q-btn flat round dense :icon="dark ? 'light_mode' : 'dark_mode'" aria-label="切换主题" @click="toggleTheme"></q-btn>
      </q-toolbar>
    </q-header>

    <q-page-container>
      <q-page class="q-pa-sm q-pa-md-md">
        <div class="assets-page">
          <div id="assets-pane" v-pre class="app-pane container-fluid px-2 px-sm-3 py-3">
            <div class="d-flex flex-wrap align-items-start justify-content-between gap-2 mb-3">
              <div>
                <div class="panel-title">全球资产</div>
                <div class="panel-subtitle">黄金、比特币、以太坊与主要海外指数。展示公开行情源的最近有效报价，不代表逐笔实时成交价。</div>
              </div>
            </div>
            <div class="insight-card mb-3">
              <div class="fw-semibold">行情更新时间</div>
              <div id="global-assets-updated" class="panel-subtitle">正在读取全球资产行情…</div>
            </div>
            <div id="global-assets-cards" class="insight-grid">
              <div class="empty-state">正在加载黄金、加密资产和海外指数报价…</div>
            </div>
            <div class="panel-subtitle mt-3">数据源：Yahoo Finance 公开图表行情接口，经 GitHub Actions 定时抓取后缓存。不同市场交易时段、币种和报价口径不同；缺少有效报价时会明确显示，不用模拟价格补齐。</div>
          </div>
        </div>
      </q-page>
    </q-page-container>

    <q-footer bordered class="bg-body text-body bottom-nav">
      <q-tabs v-model="tab" dense no-caps active-color="primary" indicator-color="primary" align="justify" @update:model-value="navigate">
        <q-tab name="stocks" icon="table_chart" label="股票池"></q-tab>
        <q-tab name="opportunity" icon="summarize" label="简报"></q-tab>
        <q-tab name="business" icon="storefront" label="生意"></q-tab>
        <q-tab name="assets" icon="public" label="全球资产"></q-tab>
      </q-tabs>
    </q-footer>
  </q-layout>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quasar@2.16.4/dist/quasar.umd.prod.js"></script>
<script>
(function () {
  'use strict';
  var app = Vue.createApp({
    data: function () {
      return { tab: 'assets', dark: document.documentElement.getAttribute('data-bs-theme') === 'dark' };
    },
    methods: {
      goHome: function () { window.location.href = './index.html'; },
      navigate: function (name) {
        var routes = {
          stocks: './index.html',
          opportunity: './index.html#opportunity',
          business: './index.html#business',
          assets: './global-assets.html'
        };
        if (routes[name]) window.location.href = routes[name];
      },
      toggleTheme: function () {
        this.dark = !this.dark;
        document.documentElement.setAttribute('data-bs-theme', this.dark ? 'dark' : 'light');
        this.$q.dark.set(this.dark);
      }
    }
  });
  app.use(Quasar, { config: { dark: false } });
  app.mount('#q-app');
})();
</script>
<script src="./global-assets.js"></script>
<script>
  if (window.StockGlobalAssets) window.StockGlobalAssets.load(false);
</script>
</body>
</html>
