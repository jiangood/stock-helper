<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>系统健康 · 大鱼池</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f8;color:#18212b}
    *{box-sizing:border-box}body{margin:0;padding:24px;max-width:980px;margin-inline:auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    h1{font-size:22px;margin:0}a{color:inherit}small,.muted{color:#687586}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .card{background:#fff;border:1px solid #dce2e8;border-radius:12px;padding:16px}
    .metric{font-size:26px;font-weight:700;margin-top:5px}.list{display:grid;gap:12px;margin-top:14px}
    .cache{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    .cache small{display:block;margin-top:3px}.status{font-size:12px;border-radius:20px;padding:4px 9px;background:#e8edf2}
    .healthy{background:#dcfce7;color:#166534}.stale{background:#fee2e2;color:#991b1b}.unknown,.degraded{background:#fef3c7;color:#92400e}
    .notice{margin-top:16px;font-size:13px;line-height:1.6}
    @media(max-width:600px){body{padding:16px}.grid{grid-template-columns:1fr}.metric{font-size:23px}}
    @media(prefers-color-scheme:dark){:root{background:#101820;color:#e7edf4}.card{background:#18232d;border-color:#344351}.muted,small{color:#aab7c4}.status{background:#344351;color:#e7edf4}.healthy{background:#14532d;color:#dcfce7}.stale{background:#7f1d1d;color:#fee2e2}.unknown,.degraded{background:#78350f;color:#fef3c7}}
  </style>
</head>
<body>
  <header>
    <div><h1>系统健康</h1><small>大鱼池 · 静态缓存监控</small></div>
    <a href="./">返回首页</a>
  </header>
  <section class="grid" aria-live="polite">
    <article class="card"><div class="muted">缓存健康</div><div class="metric" id="healthy">读取中</div></article>
    <article class="card"><div class="muted">最近缓存发布耗时</div><div class="metric" id="duration">—</div></article>
    <article class="card"><div class="muted">内容复用率</div><div class="metric" id="reuse">—</div></article>
    <article class="card"><div class="muted">缓存总大小</div><div class="metric" id="bytes">—</div></article>
  </section>
  <section class="card list">
    <strong>缓存明细</strong>
    <div id="cache-list" class="muted">正在读取缓存清单…</div>
  </section>
  <p class="notice muted" id="updated">—</p>
  <p class="notice"><a href="https://github.com/jiangood/stock-helper/actions/workflows/build-static-cache.yml">查看缓存构建记录与失败日志</a></p>
  <p class="notice muted">内容复用率表示缓存文件内容未变化的比例，不等同于 CDN HIT/MISS。GitHub Pages 不提供浏览器级 CDN 命中日志。页面读取失败会明确显示，不会回退到浏览器旧数据。</p>
  <p class="repo-footer"><a href="https://github.com/jiangood/stock-helper" target="_blank" rel="noopener noreferrer">GitHub</a></p>
  <script>
/* Inlined from cache-health.js; page-specific code. */
(function () {
  'use strict';
  const byId = id => document.getElementById(id);
  const formatBytes = value => {
    const bytes = Number(value);
    if (!Number.isFinite(bytes) || bytes < 0) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  };
  const formatTime = value => {
    if (!value) return '未知';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '未知' : date.toLocaleString('zh-CN');
  };
  const setText = (id, value) => { const node = byId(id); if (node) node.textContent = value; };
  async function load() {
    try {
      const responses = await Promise.all([
        fetch('data/cache/manifest.json', { cache: 'no-store' }),
        fetch('data/monitoring/latest.json', { cache: 'no-store' })
      ]);
      const failed = responses.find(response => !response.ok);
      if (failed) throw new Error('HTTP ' + failed.status);
      const values = await Promise.all(responses.map(response => response.json()));
      const manifest = values[0], health = values[1];
      if (manifest.schemaVersion !== 1 || !manifest.caches || health.schemaVersion !== 1) {
        throw new Error('缓存监控文件结构不兼容');
      }
      setText('healthy', health.healthyCount + ' / ' + health.cacheCount);
      setText('duration', Number.isFinite(health.durationMs) ? (health.durationMs / 1000).toFixed(2) + ' 秒' : '—');
      setText('reuse', Number.isFinite(health.contentReuseRate) ? health.contentReuseRate + '%' : '—');
      setText('bytes', formatBytes(health.totalBytes));
      setText('updated', '行情日期：' + (manifest.marketDate || '未知') + ' · 最近成功发布：' + formatTime(health.generatedAt));
      const list = byId('cache-list');
      if (!list) return;
      list.textContent = '';
      Object.entries(manifest.caches).forEach(([id, item]) => {
        const row = document.createElement('div');
        row.className = 'cache';
        const detail = document.createElement('div');
        const name = document.createElement('strong');
        name.textContent = id;
        const meta = document.createElement('small');
        meta.textContent = '日期 ' + (item.marketDate || '未知') + ' · ' + item.recordCount + ' 条 · ' + formatBytes(item.bytes);
        detail.append(name, meta);
        const badge = document.createElement('span');
        badge.className = 'status ' + (item.status || 'unknown');
        badge.textContent = item.status === 'healthy' ? '正常' : (item.status === 'stale' ? '过期' : '未知');
        row.append(detail, badge);
        list.append(row);
      });
    } catch (error) {
      setText('healthy', '不可用');
      const list = byId('cache-list');
      if (list) list.textContent = '缓存监控读取失败：' + error.message;
      setText('updated', '请检查 GitHub Actions 最近一次成功的缓存构建。');
    }
  }
  load();
})();

</script>
<script src="password-gate.js"></script>
</body>
</html>
