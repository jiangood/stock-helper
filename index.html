<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
  // Follow the operating system's light/dark appearance preference.
  (function () {
    const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');
    function applyColorScheme() {
      document.documentElement.setAttribute('data-bs-theme', colorScheme.matches ? 'dark' : 'light');
    }
    applyColorScheme();
    if (typeof colorScheme.addEventListener === 'function') {
      colorScheme.addEventListener('change', applyColorScheme);
    } else if (typeof colorScheme.addListener === 'function') {
      colorScheme.addListener(applyColorScheme);
    }
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自选 · 股票助手</title>
<meta name="theme-color" content="#2563eb">
<link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="bg-body-tertiary" data-page="stocks">

<div id="password-gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <form class="gate-card" id="password-gate-form">
    <h1 id="gate-title">股票池监控</h1>
    <p>请输入访问密码以继续</p>
    <input id="gate-password" type="password" placeholder="输入密码" autocomplete="current-password" required autofocus>
    <label class="gate-remember"><input id="gate-remember" type="checkbox" checked> 在此设备记住登录状态</label>
    <button type="submit">进入首页</button>
    <div id="gate-error" class="gate-error" role="alert">密码不正确，请重试。</div>
  </form>
</div>


<div class="sticky-top">
  <nav class="bg-body border-bottom px-2 px-sm-3 py-2 d-flex align-items-center gap-2" aria-label="主导航">
    <a class="d-flex align-items-center gap-2 text-body text-decoration-none me-auto" href="index.html"><span class="logo">股</span><strong style="font-size:14px">股票助手</strong></a>
    <a class="main-nav-link" data-page-link="stocks" href="index.html">自选</a>
    <a class="main-nav-link" data-page-link="combat" href="combat.html">作战</a>
    <a class="main-nav-link" data-page-link="market" href="market.html">行情</a>
  </nav>
  <div id="stock-toolbar" class="toolbar bg-body border-bottom px-2 px-sm-3 py-1 d-flex flex-nowrap align-items-center gap-2">
    <div class="input-group input-group-sm flex-nowrap" style="max-width:210px;min-width:0">
      <span class="input-group-text px-2" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>
      <input type="search" class="form-control" id="search-input" aria-label="搜索股票：名称 / 代码 / 别名 / 拼音" placeholder="名称 / 代码 / 别名 / 拼音" oninput="applyFilter()" style="min-width:0">
    </div>

    <select class="form-select form-select-sm w-auto flex-shrink-0" id="group-filter" onchange="applyFilter()" title="按分组筛选" aria-label="按分组筛选">
      <option value="">全部分组</option>
    </select>

    <select class="form-select form-select-sm w-auto flex-shrink-0" id="status-filter" onchange="applyFilter()" title="按鳄鱼纪律筛选" aria-label="按鳄鱼纪律筛选">
      <option value="">全部状态</option>
      <option value="heavy">重仓区</option>
      <option value="near">接近重仓</option>
      <option value="entry">入场区</option>
      <option value="pb">破净</option>
      <option value="pb80">八折</option>
      <option value="small">小市值</option>
      <option value="screen">纪律全过</option>
      <option value="screenbuy">全过 + 买点</option>
      <option value="risk">风险</option>
    </select>

    <span class="text-body-secondary text-nowrap" aria-live="polite" aria-atomic="true"><span id="stock-count" class="fw-semibold text-body">0</span> 只</span>

    <div class="ms-auto d-none d-xl-flex align-items-center gap-3 text-body-secondary">
      <span id="board-summary" class="text-nowrap"></span>
      <span class="vr opacity-25"></span>
      <span><span class="legend-pip" style="background:var(--up)"></span> 高于入场</span>
      <span><span class="legend-pip" style="background:var(--down)"></span> 低于入场</span>
    </div>
  </div>
</div>

<main id="stocks-pane" data-pane="stocks" class="app-pane container-fluid px-2 px-sm-3 py-1">
  <h1 class="visually-hidden">自选股票</h1>
  <div class="table-scroll-wrap">
  <div class="table-scroll" tabindex="0" role="region" aria-label="自选股票表，可横向滚动查看全部 15 列">
    <table class="table table-sm table-hover align-middle mb-0 stock-table" id="main-table">
      <caption class="visually-hidden">自选股票列表：名称、价格、重仓、入场、昨日、止盈1、止盈2、年初价、市值、市盈率、市净率、股息率、纪律、分组、别名</caption>
      <thead>
        <tr>
          <th scope="col" id="th-name" aria-sort="none"><button type="button" class="th-sort" data-sort="name">名称<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-price" aria-sort="none"><button type="button" class="th-sort" data-sort="price">价格<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-heavy" aria-sort="none"><button type="button" class="th-sort" data-sort="heavy">重仓<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-entry" aria-sort="none"><button type="button" class="th-sort" data-sort="entry">入场<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-prevChg" aria-sort="none"><button type="button" class="th-sort" data-sort="prevChg">昨日<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-tp1" aria-sort="none"><button type="button" class="th-sort" data-sort="tp1">止盈1<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-tp2" aria-sort="none"><button type="button" class="th-sort" data-sort="tp2">止盈2<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-yearInit" aria-sort="none"><button type="button" class="th-sort" data-sort="yearInit">年初价<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-totalCap" aria-sort="none"><button type="button" class="th-sort" data-sort="totalCap">市值<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-pe" aria-sort="none"><button type="button" class="th-sort" data-sort="pe">市盈率<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-pb" aria-sort="none"><button type="button" class="th-sort" data-sort="pb">市净率<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-divYield" aria-sort="none"><button type="button" class="th-sort" data-sort="divYield">股息率<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-screen" aria-sort="none"><button type="button" class="th-sort" data-sort="screen">纪律<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-group" aria-sort="none"><button type="button" class="th-sort" data-sort="group">分组<span class="sort-icon" aria-hidden="true"></span></button></th>
          <th scope="col" id="th-alias" aria-sort="none"><button type="button" class="th-sort" data-sort="alias">别名<span class="sort-icon" aria-hidden="true"></span></button></th>
        </tr>
      </thead>
      <tbody id="stock-tbody"></tbody>
    </table>
  </div>
  <span class="scroll-hint" aria-hidden="true"></span>
  </div>
</main>
<div class="position-fixed bottom-0 start-50 translate-middle-x mb-3 d-none" id="toast" role="status" aria-live="polite" aria-atomic="true" style="z-index:1080"></div>

<script src="croc.js"></script>
<script src="static-quotes.js"></script>
<script src="pinyin.js"></script>
<script src="stock-dashboard.js"></script>

<script src="password-gate.js"></script>

<script>
(function () {
  var page = document.body.dataset.page || 'stocks';
  document.querySelectorAll('[data-page-link]').forEach(function (link) {
    var active = link.dataset.pageLink === page;
    link.classList.toggle('active', active);
    if (active) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
})();
</script>
<script>
// Remove legacy PWA service workers and their caches for this site.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (registrations) {
    return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
  }).catch(function () {});
}
if ('caches' in window) {
  caches.keys().then(function (keys) {
    return Promise.all(keys.filter(function (key) { return key.startsWith('stock-helper-'); }).map(function (key) { return caches.delete(key); }));
  }).catch(function () {});
}
</script>

</body>
</html>
