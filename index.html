<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fa">
  <title>大鱼池 · 股票助手</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="app.css">
  <style>
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .app-header { flex: 0 0 auto; z-index: 20; }
    .app-brand { font-size: 14px; white-space: nowrap; }
    #app-navigation { display: flex; align-items: center; gap: .5rem; }
    #app-navigation nav { display: flex; align-items: center; gap: .25rem; }
    #app-view { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; }
    .legacy-page-frame { display: block; width: 100%; height: 100%; min-height: calc(100vh - 58px); border: 0; background: var(--bs-body-bg, #fff); }
    .app-loading { padding: 2rem 1rem; color: var(--bs-secondary-color); text-align: center; }
    @media (max-width: 420px) {
      .app-header { padding-left: .35rem !important; padding-right: .35rem !important; gap: .35rem !important; }
      .app-brand { display: none; }
      #app-navigation nav { gap: 0; }
      #app-navigation .main-nav-link { padding: .35rem .4rem; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="app-header sticky-top bg-body border-bottom px-2 px-sm-3 py-2 d-flex align-items-center gap-2">
    <a class="d-flex align-items-center gap-2 text-body text-decoration-none me-auto" href="#/stocks" aria-label="大鱼池自选首页">
      <span class="logo" aria-hidden="true">股</span>
      <strong class="app-brand">大鱼池 · 股票助手</strong>
    </a>
    <div id="app-navigation" aria-label="主导航"></div>
    <button class="btn btn-sm btn-outline-secondary icon-btn" id="theme-btn" type="button" aria-label="切换主题" aria-pressed="false" title="切换主题">◐</button>
  </header>
  <main id="app-view" tabindex="-1" aria-live="polite">
    <p class="app-loading">正在启动大鱼池…</p>
  </main>
  <noscript><p class="p-3">请启用 JavaScript 后使用大鱼池股票助手。</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
