<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票池监控</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --up: #dc2626; --down: #16a34a; }
  [data-bs-theme="dark"] { --up: #f23645; --down: #26a69a; }

  body { font-size: 13px; -webkit-font-smoothing: antialiased; }

  .logo {
    width: 24px; height: 24px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(140deg, #1d4ed8 0%, #3b82f6 100%);
    color: #fff; font-size: 11px; font-weight: 700;
    box-shadow: 0 2px 6px rgba(37,99,235,.3);
  }

  .toolbar { font-size: 12px; }

  /* 表格：吸顶表头 + 首列固定 */
  .table-scroll {
    max-height: calc(100vh - 78px);
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  .stock-table { min-width: 1160px; }
  .stock-table thead th {
    position: sticky; top: 0; z-index: 3;
    font-size: 11px; font-weight: 600; letter-spacing: .3px;
    white-space: nowrap; cursor: pointer; user-select: none;
    background-color: var(--bs-tertiary-bg);
    text-align: right;
    padding: .35rem .5rem;
  }
  .stock-table thead th:hover { color: var(--bs-primary); }
  .stock-table thead th:first-child,
  .stock-table tbody td:first-child {
    position: sticky; left: 0; z-index: 2;
    text-align: left;
    background-color: var(--bs-body-bg);
    box-shadow: inset -1px 0 0 var(--bs-border-color);
  }
  .stock-table thead th:first-child { z-index: 4; background-color: var(--bs-tertiary-bg); }
  .stock-table thead th:nth-child(2) { text-align: center; }
  .stock-table tbody td {
    text-align: right; white-space: nowrap;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    padding: .22rem .5rem; line-height: 1.3;
  }
  .stock-table tbody td:nth-child(2) { text-align: center; }

  /* 行状态 */
  .row-above td:first-child { box-shadow: inset 3px 0 0 var(--up), inset -1px 0 0 var(--bs-border-color); }
  .row-below td:first-child { box-shadow: inset 3px 0 0 var(--down), inset -1px 0 0 var(--bs-border-color); }
  .row-buy   td:first-child { box-shadow: inset 3px 0 0 var(--down), inset -1px 0 0 var(--bs-border-color); }
  .row-below { background-color: rgba(22,163,74,.04); }
  .row-buy   { background-color: rgba(22,163,74,.08); }

  /* 涨跌色 */
  .text-up { color: var(--up) !important; }
  .text-down { color: var(--down) !important; }

  .price-cell { font-size: 14.5px; font-weight: 700; letter-spacing: -.3px; }

  /* 名称 / 别名 */
  .stock-name { font-weight: 600; }
  .stock-name:hover { color: var(--bs-primary) !important; text-decoration: underline; }
  .tag-alias {
    font-size: 9.5px; max-width: 120px; display: inline-block;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    vertical-align: bottom;
  }

  /* 数值旁的小号涨跌幅 */
  .diff { font-size: 10px; margin-left: .15rem; letter-spacing: -.1px; }
  .unit { font-size: 9.5px; margin-left: .1rem; }
  .badge-tp { font-size: 10px; font-weight: 500; }

  .tag {
    display: inline-block; font-size: 10px; line-height: 1.35;
    padding: 0 .35rem; border-radius: 3px;
    border: 1px solid var(--bs-border-color);
    color: var(--bs-secondary-color); background-color: var(--bs-tertiary-bg);
  }

  .sort-icon { font-size: 9px; color: var(--bs-tertiary-color); }
  th.sort-asc .sort-icon::after { content: '▲'; color: var(--bs-primary); }
  th.sort-desc .sort-icon::after { content: '▼'; color: var(--bs-primary); }
  th:not(.sort-asc):not(.sort-desc) .sort-icon::after { content: '↕'; }

  .legend-pip { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

  /* 纪律旗标 */
  .flag {
    display: inline-block; font-size: 9px; line-height: 1.35; font-weight: 600;
    padding: 0 .2rem; margin-left: .25rem; border-radius: 3px;
    border: 1px solid var(--bs-border-color);
    color: var(--bs-secondary-color); background: var(--bs-tertiary-bg);
    vertical-align: 1px;
  }
  .flag-buy { color: var(--down); border-color: rgba(22,163,74,.35); background: rgba(22,163,74,.08); }
  .flag-warn { color: #b45309; border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.1); }
  .flag-danger { color: var(--up); border-color: rgba(220,38,38,.35); background: rgba(220,38,38,.08); }
  [data-bs-theme="dark"] .flag-warn { color: #fbbf24; }

  /* 体检弹窗 */
  .health-dialog {
    width: min(560px, 92vw); max-height: 82vh; padding: 0; border: 0; border-radius: 10px;
    color: var(--bs-body-color); background: var(--bs-body-bg);
    box-shadow: 0 18px 50px rgba(0,0,0,.28);
  }
  .health-dialog::backdrop { background: rgba(15,23,42,.42); }
  .health-list { max-height: 58vh; overflow: auto; }
  .health-item {
    display: flex; align-items: flex-start; gap: .5rem;
    padding: .45rem .1rem; border-bottom: 1px solid var(--bs-border-color);
  }
  .health-item:last-child { border-bottom: 0; }
  .health-item .flag { margin-left: 0; flex: 0 0 auto; margin-top: 1px; }

  @media (max-width: 575.98px) {
    .table-scroll { max-height: calc(100vh - 112px); }
    .stock-table { min-width: 900px; }
    .stock-table thead th { padding: .3rem .25rem; font-size: 10px; letter-spacing: 0; }
    .stock-table tbody td { padding: .18rem .25rem; font-size: 11px; }
    .price-cell { font-size: 12.5px; }
    .stock-table .tag { font-size: 9px; padding: 0 .25rem; }
    .badge-tp { font-size: 9px; }
    .diff { font-size: 9px; margin-left: .1rem; }
    .unit { font-size: 8.5px; }
    .tag-alias { font-size: 9px; max-width: 96px; }
    .flag { font-size: 8px; padding: 0 .15rem; margin-left: .15rem; }
    .toolbar { flex-wrap: wrap !important; row-gap: .3rem; }
    .toolbar .input-group { flex: 1 1 100%; max-width: none !important; }
  }
</style>
</head>
<body class="bg-body-tertiary">

<div class="sticky-top">
  <nav class="navbar bg-body border-bottom px-2 px-sm-3 py-1">
    <span class="navbar-brand d-flex align-items-center gap-2 mb-0 p-0">
      <span class="logo">▲</span>
      <span class="fw-semibold" style="font-size:13px">股票池监控</span>
    </span>
    <div class="ms-auto d-flex align-items-center gap-1">
      <button class="btn btn-sm btn-outline-secondary px-2 py-0" id="refresh-btn" onclick="loadPrices(true)" title="立即刷新">⟳</button>
      <button class="btn btn-sm btn-outline-secondary px-2 py-0" id="theme-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
    </div>
  </nav>

  <div class="toolbar bg-body border-bottom px-2 px-sm-3 py-1 d-flex flex-nowrap align-items-center gap-2">
    <div class="input-group input-group-sm flex-nowrap" style="max-width:210px;min-width:0">
      <span class="input-group-text px-2">🔍</span>
      <input type="text" class="form-control" id="search-input" placeholder="名称 / 代码 / 别名" oninput="applyFilter()" style="min-width:0">
    </div>

    <select class="form-select form-select-sm w-auto flex-shrink-0" id="group-filter" onchange="applyFilter()" title="按分组筛选">
      <option value="">全部分组</option>
    </select>

    <select class="form-select form-select-sm w-auto flex-shrink-0" id="status-filter" onchange="applyFilter()" title="按鳄鱼纪律筛选">
      <option value="">全部状态</option>
      <option value="heavy">重仓区</option>
      <option value="near">接近重仓</option>
      <option value="entry">入场区</option>
      <option value="pb">破净</option>
      <option value="pb80">八折</option>
      <option value="small">小市值</option>
      <option value="risk">风险</option>
    </select>

    <span class="text-body-secondary text-nowrap"><span id="stock-count" class="fw-semibold text-body">0</span> 只</span>

    <div class="ms-auto d-none d-xl-flex align-items-center gap-3 text-body-secondary">
      <span id="board-summary" class="text-nowrap"></span>
      <span class="vr opacity-25"></span>
      <span><span class="legend-pip" style="background:var(--up)"></span> 高于入场</span>
      <span><span class="legend-pip" style="background:var(--down)"></span> 低于入场</span>
    </div>

    <div class="ms-auto ms-xl-0 d-flex align-items-center gap-1">
      <button class="btn btn-sm btn-outline-secondary px-2 py-0" onclick="copyBrief()" title="复制每日简报" aria-label="复制每日简报">📋<span class="d-none d-lg-inline ms-1">简报</span></button>
      <button class="btn btn-sm btn-outline-secondary px-2 py-0" onclick="openHealth()" title="股票池体检" aria-label="股票池体检">🩺<span class="d-none d-lg-inline ms-1">体检</span></button>
    </div>
  </div>
</div>

<main class="container-fluid px-2 px-sm-3 py-1">
  <div class="table-scroll">
    <table class="table table-sm table-hover align-middle mb-0 stock-table" id="main-table">
      <thead>
        <tr>
          <th onclick="sortTable('name')"     id="th-name">     名称          <span class="sort-icon"></span></th>
          <th onclick="sortTable('price')"    id="th-price">    价格          <span class="sort-icon"></span></th>
          <th onclick="sortTable('entry')"    id="th-entry">    入场          <span class="sort-icon"></span></th>
          <th onclick="sortTable('heavy')"    id="th-heavy">   重仓          <span class="sort-icon"></span></th>
          <th onclick="sortTable('prevChg')"  id="th-prevChg">  昨日          <span class="sort-icon"></span></th>
          <th onclick="sortTable('tp1')"      id="th-tp1">      止盈1         <span class="sort-icon"></span></th>
          <th onclick="sortTable('tp2')"      id="th-tp2">      止盈2         <span class="sort-icon"></span></th>
          <th onclick="sortTable('yearInit')" id="th-yearInit"> 年初价        <span class="sort-icon"></span></th>
          <th onclick="sortTable('totalCap')" id="th-totalCap"> 市值          <span class="sort-icon"></span></th>
          <th onclick="sortTable('pe')"       id="th-pe">       市盈率        <span class="sort-icon"></span></th>
          <th onclick="sortTable('pb')"       id="th-pb">       市净率        <span class="sort-icon"></span></th>
          <th onclick="sortTable('group')"    id="th-group">    分组          <span class="sort-icon"></span></th>
          <th onclick="sortTable('alias')"    id="th-alias">    别名          <span class="sort-icon"></span></th>
        </tr>
      </thead>
      <tbody id="stock-tbody"></tbody>
    </table>
  </div>
</main>

<footer class="text-center text-body-secondary py-2 border-top bg-body">
  <div style="font-size:10px">交易时段每 60 秒自动刷新（09:15–11:30 / 13:00–15:00）</div>
  <div class="mt-1" style="font-size:10px">免责声明：本页面仅供个人投资记录参考，不构成任何投资建议。股市有风险，投资需谨慎。</div>
</footer>

<div class="position-fixed bottom-0 start-50 translate-middle-x mb-3 d-none" id="toast" style="z-index:1080"></div>

<dialog id="health-dialog" class="health-dialog" aria-labelledby="health-title">
  <div class="d-flex align-items-center gap-2 px-3 py-2 border-bottom">
    <strong id="health-title" style="font-size:13px">股票池体检</strong>
    <button type="button" class="btn-close ms-auto" style="font-size:10px" onclick="closeHealth()" aria-label="关闭"></button>
  </div>
  <div class="px-3 pt-2 pb-3" id="health-body"></div>
</dialog>

<script src="croc.js"></script>
<script src="quotes.js"></script>
<script>
// ============================================================
// State
// ============================================================
let STOCKS = [];
const priceData = {};          // code -> { price, prevClose, change, todayChange }
let refreshTimer = null;
let filteredStocks = [];
let sortState = { col: null, dir: 1 };

const $ = id => document.getElementById(id);

// 行情 SDK（接口细节见 quotes.js）
const quotes = new StockQuotes.Client({
  timeout: 8000,
  retries: 1,
  cacheTTL: 1000,
  onError: err => console.warn('[StockQuotes]', err.code, err.message)
});
const REFRESH_INTERVAL = StockQuotes.REFRESH_INTERVAL;

// ============================================================
// 数据加载
// ============================================================
async function loadStocks() {
  try {
    const res = await fetch('stocks.json', { cache: 'no-store', signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    STOCKS = await res.json();
  } catch (e) {
    console.error('加载股票数据失败:', e);
    STOCKS = [];
    showToast('股票数据加载失败：' + e.message);
  }
  buildGroupOptions();
  applyFilter();
}

function buildGroupOptions() {
  const sel = $('group-filter');
  const groups = Array.from(new Set(STOCKS.map(s => s.group).filter(Boolean)))
    .sort((a, b) => a.localeCompare(b, 'zh'));
  const current = sel.value;
  sel.innerHTML = '<option value="">全部分组</option>'
    + groups.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
  sel.value = groups.includes(current) ? current : '';
}

// ============================================================
// 排序
// ============================================================
function getSortValue(stock, col) {
  const pd = priceData[stock.code];
  const price = pd ? pd.price : null;
  switch (col) {
    case 'name':     return stock.name;
    case 'price':    return price;
    case 'prevChg':  return stock.prevChg;
    case 'yearInit': return stock.yearInit;
    case 'totalCap': return pd ? pd.totalCap : null;
    case 'pe':       return pd ? pd.pe : null;
    case 'pb':       return pd ? pd.pb : null;
    case 'entry':    return (price != null && stock.entry) ? (price - stock.entry) / stock.entry : null;
    case 'heavy':    return (price != null && stock.heavy) ? (price - stock.heavy) / stock.heavy : null;
    case 'tp1':      return stock.tp1;
    case 'tp2':      return stock.tp2;
    case 'group':    return stock.group || '';
    case 'alias':    return stock.alias || '';
    default:         return null;
  }
}

function sortedView(list) {
  if (!sortState.col) return list;
  return [...list].sort((a, b) => {
    const av = getSortValue(a, sortState.col);
    const bv = getSortValue(b, sortState.col);
    if (av === null && bv === null) return 0;
    if (av === null) return 1;
    if (bv === null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv, 'zh') * sortState.dir;
    return (av - bv) * sortState.dir;
  });
}

function updateSortUI() {
  ['name','price','entry','heavy','prevChg','tp1','tp2','yearInit','totalCap','pe','pb','group','alias'].forEach(col => {
    const th = $('th-' + col);
    if (!th) return;
    th.classList.remove('sort-asc', 'sort-desc');
    if (sortState.col === col) th.classList.add(sortState.dir === 1 ? 'sort-asc' : 'sort-desc');
  });
}

function sortTable(col) {
  if (sortState.col === col) {
    if (sortState.dir === 1)       sortState.dir = -1;
    else if (sortState.dir === -1) { sortState.dir = 0; sortState.col = null; }
    else                           { sortState.dir = 1; sortState.col = col; }
  } else {
    sortState.col = col;
    sortState.dir = 1;
  }
  buildTable();
  updateSortUI();
}

// ============================================================
// 渲染
// ============================================================
function buildTable() {
  const view = sortedView(filteredStocks);
  $('stock-tbody').innerHTML = view.map(s => `<tr class="${rowClass(s)}">${buildRow(s)}</tr>`).join('');
  $('stock-count').textContent = view.length === STOCKS.length ? view.length : `${view.length}/${STOCKS.length}`;
  updateSummary();
}

/** 顶部摘要：重仓 / 破净 / 八折 / 风险 */
function updateSummary() {
  const el = $('board-summary');
  if (!el) return;
  const c = { heavy: 0, pb: 0, pb80: 0, risk: 0 };
  STOCKS.forEach(s => {
    const e = Croc.evaluate(s, priceData[s.code]);
    if (e.zone === 'heavy') c.heavy++;
    if (e.pbUnder1) c.pb++;
    if (e.pbGolden) c.pb80++;
    if (e.st || e.loss) c.risk++;
  });
  el.innerHTML = `重仓 <b class="text-body">${c.heavy}</b> · 破净 <b class="text-body">${c.pb}</b>`
    + ` · 八折 <b class="text-body">${c.pb80}</b> · 风险 <b class="${c.risk ? 'text-up' : 'text-body'}">${c.risk}</b>`;
}

function rowClass(stock) {
  const pd = priceData[stock.code];
  if (!pd || stock.entry == null) return '';
  const zone = Croc.zoneOf(stock, pd.price);
  if (zone === 'heavy') return 'row-buy';
  if (zone === 'entry') return 'row-below';
  if (zone === 'above') return 'row-above';
  return '';
}

function buildRow(stock) {
  const pd = priceData[stock.code];
  const price = pd ? pd.price : null;
  const e = Croc.evaluate(stock, pd);

  let priceHtml = '<span class="text-body-tertiary">…</span>';
  let entryHtml = stock.entry != null ? Number(stock.entry).toFixed(2) : '<span class="text-body-tertiary">—</span>';
  let heavyHtml = stock.heavy != null ? Number(stock.heavy).toFixed(2) : '<span class="text-body-tertiary">—</span>';
  let entryDiff = '';
  let heavyDiff = '';
  let priceClass = '';

  if (price != null && price > 0) {
    const prev = pd.prevClose;
    priceClass = prev == null ? '' : price > prev ? 'text-up' : price < prev ? 'text-down' : '';
    priceHtml = `<span class="price-cell ${priceClass}">${price.toFixed(2)}</span>`;

    if (stock.entry) entryDiff = diffHtml((price - stock.entry) / stock.entry * 100);
    if (stock.heavy) heavyDiff = diffHtml((price - stock.heavy) / stock.heavy * 100);
  }

  // 止盈列
  let tp1Html = stock.tp1 != null ? `<span class="text-body-secondary">${stock.tp1}</span>` : '<span class="text-body-tertiary">—</span>';
  if (price != null && stock.tp1 != null) {
    tp1Html = price >= stock.tp1
      ? `<span class="badge badge-tp text-bg-warning-subtle border border-warning-subtle text-warning-emphasis">${stock.tp1} ✓</span>`
      : `<span class="text-body-secondary">${stock.tp1}<span class="diff text-down">+${((stock.tp1 - price) / price * 100).toFixed(1)}%</span></span>`;
  }
  let tp2Html = stock.tp2 != null ? `<span class="text-body-secondary">${stock.tp2}</span>` : '<span class="text-body-tertiary">—</span>';
  if (price != null && stock.tp2 != null && price >= stock.tp2) {
    tp2Html = `<span class="badge badge-tp text-bg-primary-subtle border border-primary-subtle text-primary-emphasis">${stock.tp2} ✓</span>`;
  }

  const prevChgHtml = stock.prevChg != null
    ? `<span class="${stock.prevChg > 0 ? 'text-up' : stock.prevChg < 0 ? 'text-down' : 'text-body-secondary'}">${stock.prevChg > 0 ? '+' : ''}${Number(stock.prevChg).toFixed(2)}%</span>`
    : '<span class="text-body-tertiary">—</span>';

  const aliasHtml = stock.alias
    ? `<span class="tag tag-alias" title="${esc(stock.alias)}">${esc(stock.alias)}</span>`
    : '<span class="text-body-tertiary">—</span>';
  const nameHtml = stock.code
    ? `<a class="stock-name text-decoration-none text-body" href="stock.html?code=${encodeURIComponent(stock.code)}" title="查看 ${esc(stock.name)} 详情">${esc(stock.name)}</a>${flagHtml(e)}`
    : `<span class="stock-name">${esc(stock.name)}</span>${flagHtml(e)}`;

  return `
    <td>${nameHtml}</td>
    <td>${priceHtml}</td>
    <td>${entryHtml}${entryDiff}</td>
    <td>${heavyHtml}${heavyDiff}</td>
    <td>${prevChgHtml}</td>
    <td>${tp1Html}</td>
    <td>${tp2Html}</td>
    <td class="text-body-secondary">${stock.yearInit != null ? Number(stock.yearInit).toFixed(2) : '<span class="text-body-tertiary">—</span>'}</td>
    <td>${fmtCap(pd && pd.totalCap)}</td>
    <td>${fmtRatio(pd && pd.pe)}</td>
    <td>${fmtRatio(pd && pd.pb)}</td>
    <td>${stock.group ? `<span class="tag">${esc(stock.group)}</span>` : '<span class="text-body-tertiary">—</span>'}</td>
    <td>${aliasHtml}</td>`;
}

function flagHtml(e) {
  if (e.st) return '<span class="flag flag-danger" title="ST 风险警示股：铁律不买 ST">ST</span>';
  if (e.loss) return '<span class="flag flag-warn" title="TTM 亏损：铁律不买亏损股">亏</span>';
  if (e.pbGolden) return '<span class="flag flag-buy" title="PB≤0.8：净资产八折黄金买点">八折</span>';
  if (e.pbUnder1) return '<span class="flag flag-buy" title="PB<1：破净">破净</span>';
  return '';
}

/** 市值：元 -> 亿 / 万亿 */
function fmtCap(cap) {
  if (cap == null || !(cap > 0)) return '<span class="text-body-tertiary">—</span>';
  const yi = cap / 1e8;
  if (yi >= 1e4) return `<span class="text-body-secondary">${(yi / 1e4).toFixed(2)}<span class="unit">万亿</span></span>`;
  return `<span class="text-body-secondary">${yi >= 1e3 ? yi.toFixed(0) : yi.toFixed(1)}<span class="unit">亿</span></span>`;
}

/** 市盈率 / 市净率（负值表示亏损，弱化显示） */
function fmtRatio(v) {
  if (v == null || !isFinite(v)) return '<span class="text-body-tertiary">—</span>';
  return `<span class="${v > 0 ? 'text-body-secondary' : 'text-body-tertiary'}">${v.toFixed(2)}</span>`;
}

function diffHtml(d) {
  const cls = d > 0 ? 'text-up' : d < 0 ? 'text-down' : 'text-body-secondary';
  return `<span class="diff ${cls}">${d > 0 ? '+' : ''}${d.toFixed(2)}%</span>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ============================================================
// 行情（通过 quotes.js SDK 获取）
// ============================================================
async function loadPrices(manual) {
  if (!STOCKS.length) return;
  if (manual) spinRefresh();

  try {
    const codes = STOCKS.map(s => s.code).filter(Boolean);
    const data = await quotes.fetch(codes, { force: !!manual });

    Object.keys(priceData).forEach(k => { delete priceData[k]; });
    Object.assign(priceData, data);

    applyFilter();
    if (manual) showToast('行情已刷新', 'success');
  } catch (e) {
    console.error('获取行情失败:', e);
    showToast('行情获取失败：' + e.message);
  }
}

function spinRefresh() {
  const btn = $('refresh-btn');
  btn.classList.add('disabled');
  btn.textContent = '◌';
  clearTimeout(btn._t);
  btn._t = setTimeout(() => {
    btn.classList.remove('disabled');
    btn.textContent = '⟳';
  }, 900);
}

function showToast(msg, type) {
  const t = $('toast');
  t.className = 'alert position-fixed bottom-0 start-50 translate-middle-x mb-3 py-2 px-3 small shadow '
              + (type === 'success' ? 'alert-success' : 'alert-danger');
  t.textContent = msg;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.add('d-none'), 2400);
}

// ============================================================
// 每日简报 / 股票池体检
// ============================================================
async function copyBrief() {
  const text = Croc.brief(STOCKS, priceData);
  try {
    await navigator.clipboard.writeText(text);
    showToast('每日简报已复制', 'success');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('每日简报已复制', 'success'); }
    catch (_) { showToast('复制失败，请检查浏览器权限'); }
    ta.remove();
  }
}

function openHealth() {
  const h = Croc.health(STOCKS, priceData);
  const order = { error: 0, warn: 1, risk: 2 };
  const issues = h.issues.slice().sort((a, b) => order[a.level] - order[b.level]);

  const label = { error: ['错误', 'flag-danger'], warn: ['提示', 'flag-warn'], risk: ['风险', 'flag-danger'] };

  const head = `<div class="d-flex flex-wrap gap-2 align-items-center mb-2" style="font-size:12px">
    <span class="text-body-secondary">${STOCKS.length} 只标的</span>
    <span class="flag flag-danger" style="margin-left:0">错误 ${h.errors}</span>
    <span class="flag flag-warn" style="margin-left:0">提示 ${h.warnings}</span>
    <span class="flag flag-danger" style="margin-left:0">风险 ${h.risks}</span>
  </div>`;

  const body = issues.length
    ? `<div class="health-list">${issues.map(i => {
        const [text, cls] = label[i.level] || label.warn;
        const name = i.code
          ? `<a class="text-body text-decoration-none" href="stock.html?code=${encodeURIComponent(i.code)}">${esc(i.name)}</a>`
          : esc(i.name);
        return `<div class="health-item">
          <span class="flag ${cls}">${text}</span>
          <div class="min-w-0">
            <div class="fw-semibold" style="font-size:12px">${name}
              ${i.code ? `<span class="text-body-tertiary fw-normal font-monospace">${esc(i.code)}</span>` : ''}
            </div>
            <div class="text-body-secondary" style="font-size:11px">${esc(i.text)}</div>
          </div>
        </div>`;
      }).join('')}</div>`
    : '<div class="alert alert-success py-2 px-3 small mb-2">未发现结构化问题。</div>';

  $('health-body').innerHTML = head + body
    + '<div class="text-body-secondary mt-2" style="font-size:10.5px">'
    + '自动检查：代码/重复、买点区间、止盈顺序、ST、TTM 亏损。国资背景、主营集中、护城河需人工核对。'
    + '</div>';

  const dlg = $('health-dialog');
  if (typeof dlg.showModal === 'function') dlg.showModal();
  else dlg.setAttribute('open', '');
}

function closeHealth() {
  const dlg = $('health-dialog');
  if (typeof dlg.close === 'function') dlg.close();
  else dlg.removeAttribute('open');
}

// ============================================================
// 筛选
// ============================================================
function applyFilter() {
  const q = ($('search-input').value || '').trim().toLowerCase();
  const group = $('group-filter').value;
  const status = $('status-filter').value;

  filteredStocks = STOCKS.filter(s => {
    if (group && s.group !== group) return false;
    if (status && !Croc.matchStatus(s, priceData[s.code], status)) return false;
    if (!q) return true;
    return s.name.toLowerCase().includes(q)
        || (s.code && s.code.toLowerCase().includes(q))
        || (s.alias && s.alias.toLowerCase().includes(q))
        || (s.group && s.group.toLowerCase().includes(q));
  });
  buildTable();
}

// ============================================================
// 自动刷新调度
// ============================================================
function scheduleRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  if (!StockQuotes.isTrading()) return;
  refreshTimer = setTimeout(async () => {
    await loadPrices(false);
    scheduleRefresh();
  }, REFRESH_INTERVAL);
}

// ============================================================
// 主题
// ============================================================
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-bs-theme', next);
  $('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('stock-theme', next);
}

(function initTheme() {
  if (localStorage.getItem('stock-theme') === 'dark') {
    document.documentElement.setAttribute('data-bs-theme', 'dark');
    $('theme-btn').textContent = '☀️';
  }
})();

// ============================================================
// 启动
// ============================================================
(function bindHealthDialog() {
  const dlg = $('health-dialog');
  if (!dlg) return;
  dlg.addEventListener('click', e => {
    if (e.target === dlg) closeHealth();
  });
})();

(async function init() {
  await loadStocks();
  await loadPrices(false);
  scheduleRefresh();
})();
</script>
</body>
</html>
