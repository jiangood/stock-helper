# H2 数据库文件根路径（不含扩展名）。本地开发默认写入 ./data/db，容器部署可用 -Ddb_path=/data/db/stock-helper 覆盖。
db_path: ./data/db/stock-helper

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /stock

spring:
  config:
    import: classpath:application-lib.yml,classpath:application-overrides.yml
  datasource:
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:file:${db_path};MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

sys:
  title: 股票助手
  file:
    upload-path: ./data/upload

logging:
  file:
    path: ./logs
  level:
    com.jiangood.stockhelper: info

stock:
  # 首次启动导入的 JSON 种子目录（相对运行目录）；也支持通过 --stock.seed-dir 指定
  seed-dir: ./data
  # 是否在启动后按 cron 自动采集
  sync:
    enabled: true
    quote-cron: "0 30 15 ? * MON-FRI"
    fundamentals-cron: "0 10 9 ? * MON"
    global-assets-cron: "0 40 6 * * ?"
    business-cron: "0 20 7,12,17,22 * * ?"
    zone: Asia/Shanghai
