<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票详情</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --up: #dc2626; --down: #16a34a; }
  [data-bs-theme="dark"] { --up: #f23645; --down: #26a69a; }

  body { font-size: 13px; -webkit-font-smoothing: antialiased; }

  .logo {
    width: 28px; height: 28px; border-radius: 7px;
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(140deg, #1d4ed8 0%, #3b82f6 100%);
    color: #fff; font-size: 12px; font-weight: 700;
    box-shadow: 0 2px 6px rgba(37,99,235,.3);
  }

  .text-up { color: var(--up) !important; }
  .text-down { color: var(--down) !important; }

  .tag {
    display: inline-block; font-size: 10px; line-height: 1.35;
    padding: 0 .35rem; border-radius: 3px;
    border: 1px solid var(--bs-border-color);
    color: var(--bs-secondary-color); background-color: var(--bs-tertiary-bg);
  }

  .price-big {
    font-size: 40px; font-weight: 700; line-height: 1.05;
    letter-spacing: -1px; font-variant-numeric: tabular-nums;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: .65rem 1rem;
  }
  .stat-item .stat-label { font-size: 11px; color: var(--bs-secondary-color); }
  .stat-item .stat-value {
    font-size: 13px; font-weight: 600;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
  }

  /* 价格刻度条 */
  .ruler-track {
    position: relative; height: 6px; margin: 1.5rem 0 .5rem;
    border-radius: 3px;
    background: var(--bs-tertiary-bg);
    box-shadow: inset 0 0 0 1px var(--bs-border-color);
  }
  .ruler-zone {
    position: absolute; top: 0; bottom: 0;
    background: rgba(22,163,74,.22);
  }
  .ruler-tick {
    position: absolute; top: -4px; width: 2px; height: 14px;
    margin-left: -1px; background: var(--bs-secondary-color);
  }
  .ruler-tick.is-current {
    top: -7px; width: 3px; height: 20px;
    background: var(--bs-primary);
    box-shadow: 0 0 0 2px var(--bs-body-bg);
  }
  .ruler-legend {
    display: flex; flex-wrap: wrap; gap: .3rem 1rem;
    font-size: 11px; color: var(--bs-secondary-color);
    font-variant-numeric: tabular-nums;
  }
  .ruler-legend .pip {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: .25rem; vertical-align: middle;
  }

  .plan-table th, .plan-table td { font-variant-numeric: tabular-nums; }
  .plan-table th { font-size: 11px; font-weight: 600; color: var(--bs-secondary-color); }
  .plan-table td { font-size: 13px; }

  #chart { height: 340px; }
  .chart-wrap { position: relative; }

  /* 52 周区间条 */
  .range-track {
    position: relative; height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, rgba(22,163,74,.45), rgba(148,163,184,.35), rgba(220,38,38,.45));
  }
  .range-pin {
    position: absolute; top: -5px; width: 3px; height: 16px;
    margin-left: -1.5px; border-radius: 2px;
    background: var(--bs-primary);
    box-shadow: 0 0 0 2px var(--bs-body-bg);
  }

  .insight-tag {
    display: inline-flex; align-items: center; gap: .25rem;
    font-size: 11px; line-height: 1.4;
    padding: .1rem .45rem; border-radius: 4px;
    border: 1px solid var(--bs-border-color);
    background: var(--bs-tertiary-bg);
    color: var(--bs-body-color);
  }
  .insight-tag.warn { border-color: rgba(220,38,38,.35); color: var(--up); background: rgba(220,38,38,.06); }
  .insight-tag.calm { border-color: rgba(22,163,74,.35); color: var(--down); background: rgba(22,163,74,.06); }

  @media (max-width: 575.98px) {
    .price-big { font-size: 32px; }
    #chart { height: 240px; }
    .stat-grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: .5rem .75rem; }
    .stat-item .stat-value { font-size: 12px; }
  }
</style>
</head>
<body class="bg-body-tertiary">

<div class="sticky-top">
  <nav class="navbar bg-body border-bottom px-3 py-2">
    <div class="d-flex align-items-center gap-2 min-w-0">
      <a class="btn btn-sm btn-outline-secondary px-2 py-1" href="index.html" title="返回股票池">←</a>
      <span class="logo">▲</span>
      <div class="min-w-0">
        <div class="d-flex align-items-baseline gap-2 min-w-0">
          <span class="fw-semibold text-truncate" style="font-size:15px" id="stock-name">加载中…</span>
          <span class="font-monospace text-body-secondary" style="font-size:12px" id="stock-code">--</span>
          <span class="tag d-none" id="group-tag"></span>
        </div>
        <div class="text-body-secondary text-truncate" style="font-size:11px" id="alias-line"></div>
      </div>
    </div>
    <div class="ms-auto d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-secondary px-2 py-1" id="refresh-btn" onclick="refreshAll(true)" title="立即刷新">⟳</button>
      <button class="btn btn-sm btn-outline-secondary px-2 py-1" id="theme-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
    </div>
  </nav>
</div>

<main class="container-xxl py-3" style="max-width:1100px">

  <!-- 空 / 错误状态 -->
  <div class="card shadow-sm d-none" id="state-box">
    <div class="card-body text-center py-5">
      <div class="fw-semibold mb-2" id="state-title">未指定股票代码</div>
      <div class="text-body-secondary small mb-3" id="state-desc"></div>
      <form class="d-none justify-content-center gap-2 flex-wrap" id="state-form">
        <input type="text" class="form-control form-control-sm" style="max-width:210px;flex:1 1 150px"
               id="code-input" placeholder="如 002408 / sh600519" autocomplete="off">
        <button class="btn btn-sm btn-primary text-nowrap" type="submit">查看</button>
        <a class="btn btn-sm btn-outline-secondary text-nowrap" href="index.html">返回首页</a>
      </form>
      <div class="d-none justify-content-center gap-2 flex-wrap" id="state-actions">
        <button class="btn btn-sm btn-primary" type="button" onclick="refreshAll(true)">重试</button>
        <a class="btn btn-sm btn-outline-secondary" href="index.html">返回首页</a>
      </div>
    </div>
  </div>

  <div class="vstack gap-3 d-none" id="content">

    <!-- 行情 -->
    <section class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex flex-wrap align-items-end gap-3">
          <div>
            <div class="price-big" id="price">--</div>
            <div class="d-flex align-items-center gap-2 mt-1">
              <span class="fw-semibold" style="font-size:14px" id="change-amount">--</span>
              <span class="badge rounded-pill text-bg-secondary" id="change-pct">--</span>
            </div>
          </div>
          <div class="ms-auto text-end text-body-secondary" style="font-size:11px">
            <div>行情时间 <span class="font-monospace" id="quote-time">--</span></div>
            <div class="mt-1">
              <a class="text-body-secondary text-decoration-none" id="em-link" href="#" target="_blank" rel="noopener">东财行情 ↗</a>
            </div>
          </div>
        </div>
        <hr class="my-3">
        <div class="stat-grid" id="stats"></div>
      </div>
    </section>

    <!-- 图表 -->
    <section class="card shadow-sm">
      <div class="card-header bg-body d-flex align-items-center gap-2 py-2">
        <div class="btn-group btn-group-sm" role="group" id="chart-tabs">
          <button class="btn btn-outline-secondary active" type="button" data-tab="day">日K</button>
          <button class="btn btn-outline-secondary" type="button" data-tab="week">周K</button>
          <button class="btn btn-outline-secondary" type="button" data-tab="month">月K</button>
        </div>
        <span class="ms-auto text-body-secondary" style="font-size:11px" id="chart-hint">前复权 · 200 根</span>
      </div>
      <div class="card-body p-2 chart-wrap">
        <div id="chart"></div>
        <div class="d-none position-absolute top-50 start-50 translate-middle text-body-secondary" style="font-size:12px" id="chart-empty">图表加载失败</div>
      </div>
    </section>

    <!-- 估值与周期位置 -->
    <section class="card shadow-sm">
      <div class="card-header bg-body d-flex align-items-center py-2">
        <span class="fw-semibold" style="font-size:13px">估值与周期位置</span>
      </div>
      <div class="card-body">
        <div class="stat-grid" id="valuation-stats"></div>

        <div class="mt-4">
          <div class="d-flex justify-content-between text-body-secondary" style="font-size:11px">
            <span>52 周低 <span class="font-monospace text-body" id="low52">--</span></span>
            <span id="range-label">--</span>
            <span>52 周高 <span class="font-monospace text-body" id="high52">--</span></span>
          </div>
          <div class="range-track mt-2"><div class="range-pin" id="range-pin" style="left:0"></div></div>
          <div class="d-flex justify-content-between text-body-secondary mt-1" style="font-size:11px">
            <span id="range-low-dist">--</span>
            <span id="range-high-dist">--</span>
          </div>
        </div>

        <div class="mt-3 pt-3 border-top">
          <div class="d-flex flex-wrap align-items-baseline gap-2" style="font-size:12px">
            <span class="text-body-secondary">同组比价</span>
            <span id="peer-summary" class="text-body-secondary">统计中…</span>
          </div>
          <div class="text-body-secondary mt-1" style="font-size:11px">
            PE 取 TTM 并剔除亏损股；折价 / 溢价 = 本股相对同组中位数
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-3" id="insight-tags"></div>
      </div>
    </section>

    <!-- 跟踪计划 -->
    <section class="card shadow-sm">
      <div class="card-header bg-body py-2 fw-semibold" style="font-size:13px">跟踪计划</div>
      <div class="card-body">
        <div class="text-body-secondary" style="font-size:12px" id="plan-note">该股票未纳入股票池，暂无跟踪计划。</div>
        <div class="d-none" id="plan-body">
          <div class="ruler-track" id="ruler-track"></div>
          <div class="ruler-legend" id="ruler-legend"></div>
          <div class="table-responsive mt-3">
            <table class="table table-sm align-middle mb-0 plan-table">
              <thead>
                <tr>
                  <th>价位</th>
                  <th class="text-end">价格</th>
                  <th class="text-end">距现价</th>
                  <th class="text-end">状态</th>
                </tr>
              </thead>
              <tbody id="plan-rows"></tbody>
            </table>
          </div>
          <div class="stat-grid mt-3" id="plan-meta"></div>
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="text-center text-body-secondary py-3 border-top bg-body px-3">
  <div style="font-size:11px">交易时段每 60 秒自动刷新（09:15–11:30 / 13:00–15:00）</div>
  <div class="mt-1" style="font-size:10px">免责声明：本页面仅供个人投资记录参考，不构成任何投资建议。股市有风险，投资需谨慎。</div>
</footer>

<div class="alert position-fixed bottom-0 start-50 translate-middle-x mb-3 py-2 px-3 small shadow d-none" id="toast" style="z-index:1080"></div>

<script src="quotes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="stock.js"></script>
</body>
</html>
